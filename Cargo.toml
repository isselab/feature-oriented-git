[package]
name = "git-varcs"
version = "2.0.0-alpha.0"
edition = "2024"

[[bin]]
name = "git-vms"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.101"
chrono = "0.4.44"
clap = { version = "4.5.59", features = ["derive"] }
git2 = "0.20.4"
pest = "2.8.6"
pest_derive = "2.8.6"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
