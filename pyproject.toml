[project]
name = "git-feature"
version = "0.1.0"
description = "Feature-oriented version control on top of git: annotate code with features, query feature history, derive product variants."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "pygit2>=1.15",
    "typer>=0.15",
    "pydantic>=2.7",
    "lark>=1.1",
    "python-ulid>=2.6",
    "xxhash>=3.4",
]

[project.scripts]
git-feature = "git_feature.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["git_feature"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["example"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pygit2.*", "xxhash.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
